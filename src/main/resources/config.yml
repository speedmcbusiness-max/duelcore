# ================================================================
#  DuelCore Configuration
#  Every text field supports MiniMessage formatting, including hex:
#    <#ff5555>Text</#ff5555>   or   <color:#ff5555>Text</color>
#  Gradients also work:  <gradient:#ff0000:#ffff00>Text</gradient>
# ================================================================

database:
  # MySQL is required for proxy/multi-server networks so data is
  # shared live between every backend server.
  host: "127.0.0.1"
  port: 3306
  name: "duelcore"
  username: "duelcore"
  password: "changeme"
  pool-size: 10
  # Unique id for THIS backend server, used for cross-server duel/party routing.
  server-id: "server-1"

currency:
  name: "Shards"
  symbol: ""
  starting-balance: 0
  format: "<#55ff55>%amount%</#55ff55>"

# ----------------------------------------------------------------
# Hotbar — given to every player on join / respawn at lobby spawn
# slot is 0-8 (hotbar left to right)
# ----------------------------------------------------------------
hotbar:
  enabled: true
  items:
    queue:
      slot: 0
      material: DIAMOND_SWORD
      name: "<#55fcf1>Queue"
      lore:
        - "<gray>Right click to join a kit queue"
      glow: true
    duel:
      slot: 1
      material: STONE_SWORD
      name: "<#ff5555>Duel"
      lore:
        - "<gray>Right click to challenge a player"
    leaderboard:
      slot: 2
      material: OAK_SIGN
      name: "<#ffaa00>Leaderboard"
      lore:
        - "<gray>Right click to view the Tier-Test leaderboard"
    party:
      slot: 3
      material: CAKE
      name: "<#ff55ff>Party"
      lore:
        - "<gray>Right click to open your party menu"
    settings:
      slot: 6
      material: BOOK
      name: "<#aaaaaa>Settings"
      lore:
        - "<gray>Right click to open settings"
    kiteditor:
      slot: 7
      material: CRAFTING_TABLE
      name: "<#ffd700>Kit Editor"
      lore:
        - "<gray>Right click to edit your kit loadouts"

